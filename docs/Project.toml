# Environment for building the documentation — deliberately minimal.
#
# docs/make.jl needs exactly four things: Documenter, PrettyTables, Latexify
# and Jexpresso itself, which the Documentation workflow adds with
# `Pkg.develop(PackageSpec(path = pwd()))`. Everything else the docs touch
# arrives transitively through Jexpresso, at the versions Jexpresso's own
# [compat] allows.
#
# Do NOT re-add the main package's dependency list here. This file used to be
# a copy of it, and the copy went stale: it still asked for Gmsh, whose only
# julia-compatible version (0.1.1) pins gmsh_jll ≤ 4.9.3 → MMG_jll 5.6.0 →
# SCOTCH_jll "uninstalled", which cannot coexist with the SCOTCH_jll 7.x that
# Jexpresso's MUMPS requires. The result was an unsatisfiable environment and
# a Documentation job that failed in 30 seconds at `Pkg.develop`, on every
# push, without ever building a page. It also carried Hecke, Makie, JLD and
# TestingUtilities, none of which the docs use.
#
# If a doc page ever needs a package to run an `@example` block, add that one
# package — not the list.

[deps]
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
Latexify = "23fbe1c1-3f47-55db-b15f-69d7ec21a316"
PrettyTables = "08abe8d2-0d0c-5749-adfa-8a2ac140af0d"

[compat]
# make.jl uses Documenter 1 features (`warnonly`, `size_threshold`).
Documenter = "1"
