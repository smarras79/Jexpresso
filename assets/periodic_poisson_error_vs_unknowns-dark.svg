<title id="t">Error vs unknowns: SEM, pseudo-spectral, FFT</title><desc id="d">L-infinity error versus number of unknowns (1024 to 16384). SEM falls exponentially from 3e-3 to 2e-11; pseudo-spectral and FFT are at round-off (1e-14 to 7e-13, and 2e-15 to 3e-15) at every size because the exact solution is a trigonometric polynomial.</desc>
