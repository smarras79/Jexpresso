<title id="t">SEM p-convergence, periodic Poisson problem</title>
<desc id="d">L-infinity and relative L2 errors of the direct SEM solve of -laplacian u = f on [0,2pi]^2, doubly periodic, 16 by 16 elements, versus polynomial order 2 to 8. Both fall exponentially, from about 3e-3 at order 2 to about 2e-11 (L-infinity) and 5e-12 (relative L2) at order 8.</desc>
