#==============================================================================
# Generate CI reference solutions.
#
# Run this manually to (re)create the golden HDF5 files in test/CI-ref/:
#   * once for a newly registered case, so the benchmarks/CI comparison has
#     something to compare against;
#   * again whenever a physics or numerics change intentionally moves the
#     expected answer.
#
# Like the benchmarks workflow, the job matrix comes from test/ci_cases.jl —
# a new case needs no change here. By default every registered case is
# regenerated; pass a comma-separated list to regenerate only some of them.
#
# What happens:
#   1. One job per selected case runs it with CI_MODE=true; the HDF5 output
#      lands in test/CI-runs/<eqs>/<case>/output/.
#   2. That output is staged as test/CI-ref/<eqs>/<case>/output/ and uploaded
#      as an artifact.
#   3. A single final job downloads every artifact, merges the tree into
#      test/CI-ref/ and pushes ONE commit to the branch the workflow ran on
#      (one job pushing avoids the races of parallel jobs pushing).
#==============================================================================
name: Generate CI Reference Solutions

on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'Cases to regenerate: "all" or a comma-separated list such as "CompEuler/theta"'
        required: false
        default: 'all'
      commit_message:
        description: 'Commit message for the reference update'
        required: false
        default: 'Update CI reference solutions'

concurrency:
  group: generate-ci-ref-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  #----------------------------------------------------------------------------
  # Turn test/ci_cases.jl into the job matrix.
  #----------------------------------------------------------------------------
  setup:
    name: Build case matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
      count:  ${{ steps.cases.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - name: Validate registry
        run: julia test/ci_cases.jl validate

      - name: Select cases
        id: cases
        env:
          CASES: ${{ github.event.inputs.cases || 'all' }}
        run: |
          matrix=$(julia test/ci_cases.jl matrix "$CASES")
          count=$(julia test/ci_cases.jl count  "$CASES")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count"   >> "$GITHUB_OUTPUT"
          echo "Selected $count case(s): $matrix"

  #----------------------------------------------------------------------------
  # One job per case: run it and stage its output as a reference candidate.
  #----------------------------------------------------------------------------
  generate:
    name: ${{ matrix.name }}
    needs: setup
    if: needs.setup.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
          arch: x64

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - name: Generate
        id: gen
        continue-on-error: true
        timeout-minutes: ${{ matrix.timeout }}
        env:
          JEXPRESSO_EQS:  ${{ matrix.eqs }}
          JEXPRESSO_CASE: ${{ matrix.case }}
        run: |
          julia --project=. -e '
            using Jexpresso
            Jexpresso.run_case(ENV["JEXPRESSO_EQS"], ENV["JEXPRESSO_CASE"];
                               CI_MODE = true)
          '

      # Same script you would run locally (test/generate_ci_ref.jl), here in
      # --copy-only mode and pointed at a staging tree whose layout matches
      # test/CI-ref/, so the collecting job can merge the artifacts straight
      # into it. No project needed: copying touches no package.
      - name: Stage reference files
        id: stage
        if: always()
        continue-on-error: true
        env:
          CASE_NAME: ${{ matrix.name }}
        run: julia test/generate_ci_ref.jl --copy-only --dest staging "$CASE_NAME"

      - name: Upload reference candidate
        if: always() && steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ciref-${{ matrix.slug }}
          path: staging/
          if-no-files-found: error
          retention-days: 7

      - name: Report case outcome
        if: always()
        env:
          GEN:   ${{ steps.gen.outcome }}
          STAGE: ${{ steps.stage.outcome }}
        run: |
          if [ "$GEN" != "success" ] || [ "$STAGE" != "success" ]; then
            echo "::error title=${{ matrix.name }}::run=$GEN, staging=$STAGE"
            exit 1
          fi
          echo "${{ matrix.name }}: reference generated."

  #----------------------------------------------------------------------------
  # Collect every generated reference and push a single commit.
  #----------------------------------------------------------------------------
  commit:
    name: Commit reference solutions
    needs: [setup, generate]
    if: always() && needs.setup.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download generated references
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ciref-*
          path: test/CI-ref
          merge-multiple: true

      - name: Commit and push
        env:
          COMMIT_MESSAGE: ${{ github.event.inputs.commit_message || 'Update CI reference solutions' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test/CI-ref/

          if git diff --staged --quiet; then
            echo "No reference files changed — nothing to commit." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Reference solutions updated"
            echo ""
            echo '```'
            git diff --staged --name-status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          git commit -m "${COMMIT_MESSAGE} [skip ci]"

          # Retry the push: another job may have moved the branch meanwhile.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Reference files pushed to ${GITHUB_REF_NAME}."
              exit 0
            fi
            echo "Push failed (attempt $attempt) — rebasing and retrying."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((2 ** attempt))
          done
          echo "::error::could not push the reference solutions"
          exit 1
