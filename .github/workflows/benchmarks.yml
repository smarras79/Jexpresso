#==============================================================================
# Benchmarks — one GitHub Actions job per registered CI case.
#
# The job matrix is generated at run time from test/ci_cases.jl, so adding a
# benchmark means adding one line to that file: a new job appears here
# automatically, with its own timeout, its own log, its own output artifact
# and its own row in the summary table.
#
# Each job
#   1. runs the case with CI_MODE=true (inputs from test/CI-runs/<eqs>/<case>,
#      HDF5 output into test/CI-runs/<eqs>/<case>/output/),
#   2. compares that output against test/CI-ref/<eqs>/<case>/output/ with the
#      tolerance declared in the registry,
#   3. uploads the output and a small status file.
#
# A case with no committed reference solution is reported as SKIPPED, not
# failed — run the `generate-ci-ref` workflow to create its reference.
#
# This workflow deliberately does NOT run on pull requests: CI.yml already
# runs the same cases through `Pkg.test()` there, and these runs are
# expensive. Uncomment the `pull_request:` trigger below if you want the
# per-case table on every PR as well.
#==============================================================================
name: Benchmarks

on:
  push:
    branches:
      - master
  # pull_request:
  #   branches:
  #     - master
  schedule:
    - cron: '0 2 * * 0'   # Weekly, Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      cases:
        description: 'Cases to run: "all" or a comma-separated list such as "CompEuler/theta,Burgers/case1"'
        required: false
        default: 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  #----------------------------------------------------------------------------
  # Turn test/ci_cases.jl into the job matrix.
  #----------------------------------------------------------------------------
  setup:
    name: Build case matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
      count:  ${{ steps.cases.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - name: Validate registry
        run: julia test/ci_cases.jl validate

      - name: Select cases
        id: cases
        env:
          # Quoted through the environment rather than interpolated into the
          # command line, so a dispatch input cannot inject shell code.
          CASES: ${{ github.event.inputs.cases || 'all' }}
        run: |
          matrix=$(julia test/ci_cases.jl matrix "$CASES")
          count=$(julia test/ci_cases.jl count  "$CASES")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count"   >> "$GITHUB_OUTPUT"
          echo "Selected $count case(s): $matrix"

  #----------------------------------------------------------------------------
  # One job per case.
  #----------------------------------------------------------------------------
  benchmark:
    name: ${{ matrix.name }}
    needs: setup
    if: needs.setup.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
          arch: x64

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - name: Simulate
        id: sim
        continue-on-error: true
        timeout-minutes: ${{ matrix.timeout }}
        env:
          JEXPRESSO_EQS:  ${{ matrix.eqs }}
          JEXPRESSO_CASE: ${{ matrix.case }}
        run: |
          julia --project=. -e '
            using Jexpresso
            Jexpresso.run_case(ENV["JEXPRESSO_EQS"], ENV["JEXPRESSO_CASE"];
                               CI_MODE = true)
          '

      - name: Compare against reference solution
        id: compare
        if: always()
        continue-on-error: true
        env:
          JEXPRESSO_CASE_NAME: ${{ matrix.name }}
        run: julia --project=. test/compare_benchmarks.jl "$JEXPRESSO_CASE_NAME"

      - name: Upload run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.slug }}
          path: test/CI-runs/${{ matrix.eqs }}/${{ matrix.case }}/output/
          if-no-files-found: warn
          retention-days: 14

      # One line per case, collected by the `report` job below into a single
      # table. Written as an artifact because matrix jobs cannot share outputs.
      - name: Record status
        if: always()
        env:
          CASE_NAME: ${{ matrix.name }}
          SIM:       ${{ steps.sim.outcome }}
          COMPARE:   ${{ steps.compare.outcome }}
        run: |
          mkdir -p status
          printf '%s|%s|%s\n' "$CASE_NAME" "$SIM" "$COMPARE" \
            > "status/${{ matrix.slug }}.txt"

      - name: Upload status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.slug }}
          path: status/
          retention-days: 14

      - name: Fail the job if this case failed
        if: always()
        env:
          SIM:     ${{ steps.sim.outcome }}
          COMPARE: ${{ steps.compare.outcome }}
        run: |
          if [ "$SIM" != "success" ] || [ "$COMPARE" != "success" ]; then
            echo "::error title=${{ matrix.name }}::simulation=$SIM comparison=$COMPARE"
            exit 1
          fi
          echo "${{ matrix.name }}: simulation and comparison passed."

  #----------------------------------------------------------------------------
  # Aggregate every case into one table and one pass/fail check.
  #----------------------------------------------------------------------------
  report:
    name: Benchmark report
    needs: [setup, benchmark]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download statuses
        uses: actions/download-artifact@v4
        # Tolerate the pathological case where no matrix job got far enough to
        # upload a status; the summary step reports that as a failure.
        continue-on-error: true
        with:
          pattern: status-*
          path: status
          merge-multiple: true

      - name: Write summary
        id: summary
        run: |
          icon() {
            case "$1" in
              success) echo "✅ pass" ;;
              skipped) echo "⏭️ skipped" ;;
              *)       echo "❌ $1" ;;
            esac
          }

          failed=0
          {
            echo "## Benchmark results"
            echo ""
            echo "| Case | Simulation | Comparison vs reference |"
            echo "|------|------------|-------------------------|"
          } >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          files=(status/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "| _no cases ran_ | | |" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          for f in "${files[@]}"; do
            IFS='|' read -r name sim compare < "$f"
            echo "| \`$name\` | $(icon "$sim") | $(icon "$compare") |" \
              >> "$GITHUB_STEP_SUMMARY"
            [ "$sim" = "success" ] && [ "$compare" = "success" ] || failed=1
          done

          {
            echo ""
            echo "Cases come from \`test/ci_cases.jl\`; references from \`test/CI-ref/\`."
            echo "A case whose comparison reports *no reference files* needs the"
            echo "**generate-ci-ref** workflow to be run once."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ $failed -ne 0 ]; then
            echo "One or more benchmarks failed — see the table above."
            exit 1
          fi
          echo "All benchmarks passed."
