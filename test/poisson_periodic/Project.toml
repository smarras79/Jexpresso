# Environment of the periodic Poisson solver tests (test/poisson_periodic/).
# Deliberately NOT the Jexpresso environment: the solver cores under test are
# free of Jexpresso types, so these tests run in seconds with:
#
#   julia --project=test/poisson_periodic -e 'using Pkg; Pkg.instantiate()'
#   julia --project=test/poisson_periodic test/poisson_periodic/test_fft_poisson.jl
#   julia --project=test/poisson_periodic test/poisson_periodic/test_pseudospectral_poisson.jl
#
# KernelAbstractions is only there so that Kopriva_functions.jl (which defines
# one GPU kernel) can be included standalone for the pseudo-spectral test.
[deps]
FFTW = "7a1cc6ca-52ef-59f5-83cd-3a7055c09341"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[compat]
FFTW = "1.8"
julia = "1.11"
